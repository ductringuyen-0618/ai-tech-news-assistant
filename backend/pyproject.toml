[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["src"]
known_third_party = ["fastapi", "pydantic", "uvicorn", "pytest"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
python_classes = [
    "Test*",
]
python_functions = [
    "test_*",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.ruff.lint]
# Pin the enforced rule set explicitly. Ruff's *default* selection has
# grown across releases (pyupgrade "UP" and ruff-specific "RUF" rules
# are enabled by default on newer ruff versions) -- CI installs ruff
# unpinned (`pip install ruff`), so the same `ruff check .` command
# silently got far stricter over time with no code change, going from
# a real (if debt-laden) ~1500-error baseline to 1700+ against rule
# categories (modernization suggestions, not correctness) this project
# never opted into. Pin to the conventional "real bugs" baseline this
# repo's CI was actually designed against.
select = ["E4", "E7", "E9", "F"]
