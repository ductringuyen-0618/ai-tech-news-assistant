    <script>
      (function () {
        try {
          var stored = localStorage.getItem("techpulse-theme");
          var theme = (stored === "light" || stored === "dark") ? stored : "dark";
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          try { document.documentElement.classList.add("dark"); } catch (_) {}
        }
      })();
    </script>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("techpulse_mode");
          var mode = (stored === "atelier" || stored === "mission") ? stored : "atelier";
          document.documentElement.setAttribute("data-mode", mode);
        } catch (e) {
          try { document.documentElement.setAttribute("data-mode", "atelier"); } catch (_) {}
        }
      })();
    </script>
